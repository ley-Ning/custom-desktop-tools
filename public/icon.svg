<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- iOS 风格圆角矩形背景 -->
  <rect width="512" height="512" rx="115" fill="url(#gradient)"/>
  
  <!-- 渐变定义 -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5B86E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#36D1DC;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 工具箱图标 - 简洁的 iOS 风格 -->
  <g transform="translate(256, 256)">
    <!-- 工具箱主体 -->
    <rect x="-100" y="-60" width="200" height="120" rx="20" fill="white" opacity="0.95"/>
    
    <!-- 工具箱手柄 -->
    <path d="M-60,-60 L-60,-90 Q-60,-100 -50,-100 L50,-100 Q60,-100 60,-90 L60,-60" 
          stroke="white" stroke-width="16" fill="none" opacity="0.95" stroke-linecap="round"/>
    
    <!-- 工具箱锁扣 -->
    <rect x="-10" y="-20" width="20" height="40" rx="4" fill="url(#gradient)"/>
    
    <!-- 装饰线条 -->
    <line x1="-80" y1="-30" x2="80" y2="-30" stroke="url(#gradient)" stroke-width="3" opacity="0.6"/>
    <line x1="-80" y1="30" x2="80" y2="30" stroke="url(#gradient)" stroke-width="3" opacity="0.6"/>
  </g>
  
  <!-- 高光效果 -->
  <ellipse cx="256" cy="100" rx="200" ry="60" fill="white" opacity="0.2"/>
</svg>
